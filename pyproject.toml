[project]
name = "aethon-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "watchdog>=4.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "google-genai>=0.3",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-reportlab>=4.0",
    "pypdf>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
